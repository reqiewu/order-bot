services:
  order-bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOLT_PATH: /data/order-bot.db
      MINIAPP_STATIC_DIR: /app/web/dist
      MINIAPP_ADDR: ":8080"
    ports:
      - "${MINIAPP_PORT:-8080}:8080"
    volumes:
      - orderdata:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  orderdata:
