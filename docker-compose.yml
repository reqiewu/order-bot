services:
  order-bot:
    # Локально: build. С CI: IMAGE=ghcr.io/reqiewu/order-bot:latest make start
    image: ${IMAGE:-order-bot:local}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOLT_PATH: /data/order-bot.db
      MINIAPP_STATIC_DIR: /app/web/dist
      ASSETS_DIR: /data/assets
      # tg-login пишет ./data/tg.session на хосте; в контейнере это не ./data
      TELEGRAM_SESSION_PATH: /session/tg.session
      METRICS_ADDR: ":9091"
    ports:
      - "${MINIAPP_PORT:-8080}:${MINIAPP_PORT:-8080}"
    volumes:
      - orderdata:/data
      - ./data:/session:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - order-bot

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    user: "0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloydata:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  orderdata:
  prometheusdata:
  grafanadata:
  lokidata:
  alloydata:
